<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Event Ticket</title>

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="event.css">
  <script src="event.js" defer></script>
</head>

<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="EventTicket">

      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required >
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required >
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required >
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="">-- Select One --</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required >
      </div>

      <!-- Hidden until Student or Guest is selected -->
      <div id="accessfield" class="field full" hidden>
        <label id="accessLabel" for="accessInput">Access Code</label>
        <input id="accessInput" name="accessInput" type="text" >
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <div id="output" aria-live="polite"></div>

  </main>
</body>
</html>
