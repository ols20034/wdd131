<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A character card built displaying stats, image, and interactive actions built with HTML, CSS, and JavaScript.">
  <title>Character Card</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Character Card – Swamp Beast Diplomat">
  <meta property="og:description" content="A character card built displaying stats, image, and interactive actions built with HTML, CSS, and JavaScript.">
  <meta property="og:url" content="https://yourwebsite.com/charactercard">
  <meta property="og:image" content="https://yourwebsite.com/images/social-preview.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Character Card – Swamp Beast Diplomat">
  <meta name="twitter:description" content="A character card built displaying stats, image, and interactive actions built with HTML, CSS, and JavaScript.">
  <meta name="twitter:image" content="https://yourwebsite.com/images/social-preview.png">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">
    <img id="charImage" class="image" src="images/snortleblat.png" alt="Character Image">

    <div id="charName" class="name"></div>

    <div class="stats">
      <p id="charClass"></p>
      <p id="charLevel"></p>
      <p id="charHealth"></p>
    </div>

    <div class="buttons">
      <button onclick="character.attacked()">Attack</button>
      <button onclick="character.levelUp()">Level Up</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
