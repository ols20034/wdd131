<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recipe Book</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="recipes.css">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Recipe Book">
<meta property="og:description" content="Delicious homemade recipes for everyone.">
<meta property="og:url" content="https://yourwebsite.com">
<meta property="og:image" content="images/social-preview-image.png">

<!-- X Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Recipe Book">
<meta name="twitter:description" content="Delicious homemade recipes for everyone.">
<meta name="twitter:image" content="images/social-preview-image.png">

<!-- Icons -->
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

</head>

<body>

<header class="header">

<div class="logo-title">
    <img src="images/recipe-book.png" alt="recipe logo">
    <h1>Recipe Book</h1>
</div>

<div class="search">
    <input id="searchInput" type="text" placeholder="Find a recipe...">

    <button id="searchButton" class="search-btn">
        <img src="images/search.svg" alt="search icon">
    </button>
</div>

</header>

<!-- recipe container -->
<main id="recipeContainer"></main>

<footer>

<div class="social">
    <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
    <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
    <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
</div>

<a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
    Recipe icons created by Freepik - Flaticon
</a>

</footer>

<!-- Load JS LAST -->
<script src="recipes.js"></script>

</body>
</html>
